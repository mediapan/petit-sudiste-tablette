<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Présentation — Petit Sudiste 13</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap');

  :root {
    --bg: #0a0a1a;
    --surface: #12122a;
    --surface2: #1a1a3a;
    --accent: #ff2d78;
    --accent2: #00e5cc;
    --accent3: #ffe600;
    --text: #f5f0ff;
    --muted: #a090c0;
    --border: rgba(255,45,120,0.2);
    --green: #00e5cc;
    --red: #ff2d78;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow: hidden; height: 100%; }
  body { background: linear-gradient(160deg, #0d0030 0%, #0a0a1a 30%, #001a2e 60%, #0d1a00 100%); }

  .leaf { position:fixed; pointer-events:none; z-index:0; }
  .leaf-1 { top: 2%;  right: 1%;  font-size: 100px; opacity: 0.12; transform: rotate(10deg); }
  .leaf-2 { top: 50%; right: 2%;  font-size: 70px;  opacity: 0.1; transform: scaleX(-1); }
  .leaf-3 { top: 2%;  left: 1%;   font-size: 90px;  opacity: 0.12; transform: rotate(-10deg) scaleX(-1); }
  .leaf-4 { top: 50%; left: 2%;   font-size: 65px;  opacity: 0.1; }

  #app { display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 1; }

  /* HEADER */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px;
    background: linear-gradient(135deg, #1a0030, #0d0830, #001a30);
    border-bottom: 2px solid rgba(255,45,120,0.4);
    flex-shrink: 0;
  }

  .header-title { font-family: 'Playfair Display', serif; font-size: 20px; color: #ff6eb0; }

  .back-btn {
    font-size: 14px; font-weight: 500;
    color: white;
    background: linear-gradient(135deg, #ff2d78, #ff6eb0);
    border: none;
    border-radius: 24px; padding: 9px 22px;
    font-family: 'DM Sans', sans-serif; cursor: pointer;
    text-decoration: none;
    box-shadow: 0 2px 12px rgba(255,45,120,0.4);
  }

  /* ONGLETS */
  .tabs-bar {
    display: flex; gap: 6px; padding: 12px 20px;
    overflow-x: auto; flex-shrink: 0;
    background: rgba(18,18,42,0.8);
    border-bottom: 1px solid rgba(255,45,120,0.2);
    scrollbar-width: none;
  }
  .tabs-bar::-webkit-scrollbar { display: none; }

  .tab-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 20px; border-radius: 24px;
    border: 1px solid rgba(255,45,120,0.3);
    background: transparent; color: var(--muted);
    font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
    cursor: pointer; white-space: nowrap; transition: all 0.15s;
    flex-shrink: 0;
  }

  .tab-btn.active {
    background: linear-gradient(135deg, #ff2d78, #ff6eb0);
    border-color: transparent; color: white;
    box-shadow: 0 2px 12px rgba(255,45,120,0.4);
  }

  .tab-emoji { font-size: 18px; }

  /* CONTENU */
  .tab-content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

  .tab-panel { display: none; flex: 1; flex-direction: column; }
  .tab-panel.active { display: flex; }

  /* VIDÉO */
  .video-container {
    flex: 1; padding: 16px 20px;
    display: flex; flex-direction: column; gap: 12px;
  }

  .video-frame {
    flex: 1; border-radius: 16px; overflow: hidden;
    background: rgba(18,18,42,0.9);
    border: 1px solid rgba(255,45,120,0.2);
    min-height: 0;
  }

  .video-frame iframe { width: 100%; height: 100%; border: none; }

  .no-video {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(18,18,42,0.6);
    border-radius: 16px;
    border: 1px dashed rgba(255,45,120,0.3);
    gap: 12px;
  }

  .no-video-emoji { font-size: 80px; opacity: 0.5; }
  .no-video-text { font-size: 16px; color: var(--muted); text-align: center; }

  .tab-desc {
    font-size: 14px; color: var(--muted);
    background: rgba(18,18,42,0.8);
    border-radius: 10px; padding: 10px 14px;
    border-left: 3px solid #ff2d78;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="leaf leaf-1">🌴</div>
<div class="leaf leaf-2">🌺</div>
<div class="leaf leaf-3">🌴</div>
<div class="leaf leaf-4">🦜</div>

<div id="app">
  <div class="header">
    <div class="header-title">🎬 Présentation</div>
    <a class="back-btn" href="tablette.html">← Retour</a>
  </div>

  <div class="tabs-bar" id="tabs-bar"></div>

  <div class="tab-content" id="tab-content"></div>
</div>

<script>
const GITHUB_USER = 'mediapan';
const GITHUB_REPO = 'petit-sudiste-tablette';
const DATA_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/data.json`;

let onglets = [];
let actif = 0;

function charger() {
  fetch(DATA_URL + '?t=' + Date.now())
    .then(r => r.json())
    .then(d => {
      onglets = d.presentation || [];
      afficher();
    })
    .catch(() => afficher());
}

function afficher() {
  const tabsBar = document.getElementById('tabs-bar');
  const tabContent = document.getElementById('tab-content');
  tabsBar.innerHTML = '';
  tabContent.innerHTML = '';

  onglets.forEach((o, i) => {
    // Onglet
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === actif ? ' active' : '');
    btn.innerHTML = `<span class="tab-emoji">${o.emoji}</span>${o.titre}`;
    btn.onclick = () => { actif = i; afficher(); };
    tabsBar.appendChild(btn);

    // Panel
    const panel = document.createElement('div');
    panel.className = 'tab-panel' + (i === actif ? ' active' : '');

    if (o.driveId) {
      panel.innerHTML = `
        <div class="video-container">
          <div class="video-frame">
            <iframe src="https://drive.google.com/file/d/${o.driveId}/preview" allow="autoplay"></iframe>
          </div>
          ${o.desc ? `<div class="tab-desc">${o.desc}</div>` : ''}
        </div>`;
    } else {
      panel.innerHTML = `
        <div class="video-container">
          <div class="no-video">
            <div class="no-video-emoji">${o.emoji}</div>
            <div class="no-video-text">${o.desc || 'Vidéo bientôt disponible'}</div>
          </div>
        </div>`;
    }

    tabContent.appendChild(panel);
  });
}

charger();
</script>
</body>
</html>
