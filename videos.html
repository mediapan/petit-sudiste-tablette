<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidéos — Petit Sudiste 13</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap');

    :root {
    --bg: #0a0a1a;
    --surface: #12122a;
    --surface2: #1a1a3a;
    --accent: #ff2d78;
    --accent2: #00e5cc;
    --accent3: #ffe600;
    --text: #f5f0ff;
    --muted: #a090c0;
    --border: rgba(255,45,120,0.2);
    --green: #00e5cc;
    --red: #ff2d78;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  body { background: linear-gradient(160deg, #0d0030 0%, #0a0a1a 30%, #001a2e 60%, #0d1a00 100%); }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }

  .header-title { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--accent); }

  .back-btn {
    font-size: 15px; font-weight: 500;
    color: white;
    background: linear-gradient(135deg, #ff2d78, #ff6eb0);
    border: none;
    border-radius: 24px; padding: 10px 24px;
    font-family: 'DM Sans', sans-serif; cursor: pointer;
    text-decoration: none;
    box-shadow: 0 2px 12px rgba(200,240,0,0.3);
    transition: opacity 0.15s;
  }
  .back-btn:hover { opacity: 0.85; }

  .content { padding: 24px 28px; max-width: 1000px; margin: 0 auto; }

  .section-title {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted); margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::before { content: ''; width: 20px; height: 1px; background: linear-gradient(135deg, #ff2d78, #ff6eb0); }

  /* VIDÉO PRINCIPALE */
  .video-featured {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .video-embed {
    width: 100%;
    aspect-ratio: 16/9;
    border: none;
  }

  .video-info {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .video-title {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--text);
  }

  .video-desc {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    line-height: 1.5;
  }

  /* GRILLE VIDÉOS */
  .videos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  .video-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }

  .video-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.2); }
  .video-card.active { border-color: var(--accent); }

  .video-thumb {
    width: 100%; aspect-ratio: 16/9;
    background: linear-gradient(135deg, #0f3d20, #062010);
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; position: relative;
  }

  .play-btn {
    position: absolute;
    width: 50px; height: 50px;
    background: rgba(255,140,58,0.9);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; padding-left: 4px;
  }

  .video-card-info { padding: 12px 14px; }
  .video-card-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  .video-card-desc  { font-size: 12px; color: var(--muted); line-height: 1.4; }

    .leaf { position:fixed; pointer-events:none; z-index:0; }
  .leaf-1 { top: 2%;  right: 1%;  font-size: 120px; opacity: 0.15; transform: rotate(10deg); }
  .leaf-2 { top: 25%; right: 2%;  font-size: 80px;  opacity: 0.12; transform: scaleX(-1); }
  .leaf-3 { top: 55%; right: 1%;  font-size: 90px;  opacity: 0.12; }
  .leaf-4 { top: 2%;  left: 1%;   font-size: 110px; opacity: 0.15; transform: rotate(-10deg) scaleX(-1); }
  .leaf-5 { top: 30%; left: 2%;   font-size: 70px;  opacity: 0.1; }
  .leaf-6 { top: 60%; left: 1%;   font-size: 85px;  opacity: 0.12; }
</style>
</head>
<body>
<div class="leaf leaf-1">🌴</div>
<div class="leaf leaf-2">🦜</div>
<div class="leaf leaf-3">🌺</div>
<div class="leaf leaf-4">🌴</div>
<div class="leaf leaf-5">🌸</div>
<div class="leaf leaf-6">🦜</div>



<div class="header">
  <div class="header-title">🎬 Vidéos</div>
  <a class="back-btn" href="tablette.html">← Retour</a>
</div>

<div class="content">

  <!-- LECTEUR PRINCIPAL -->
  <div class="video-featured" id="main-player">
    <iframe class="video-embed" id="main-iframe"
      src="https://drive.google.com/file/d/1FSYR1B455BxExDNCGTiaR-vTIlr4sYe6/preview"
      allow="autoplay">
    </iframe>
    <div class="video-info">
      <div>
        <div class="video-title" id="main-title">Présentation de l'appartement</div>
        <div class="video-desc" id="main-desc">Découvrez le Petit Sudiste 13 — votre logement pour ce séjour</div>
      </div>
    </div>
  </div>

  <!-- LISTE VIDÉOS -->
  <div class="section-title">Toutes les vidéos</div>
  <div class="videos-grid" id="videos-grid"></div>

</div>

<script>
const GITHUB_USER = 'mediapan';
const GITHUB_REPO = 'petit-sudiste-tablette';
const DATA_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/data.json`;

// Vidéos par défaut (modifiables depuis l'admin plus tard)
const defaultVideos = [
  {
    id: 1,
    titre: 'Présentation de l\'appartement',
    desc: 'Découvrez le Petit Sudiste 13 — votre logement pour ce séjour',
    emoji: '🏠',
    driveId: '1FSYR1B455BxExDNCGTiaR-vTIlr4sYe6'
  }
];

let videos = defaultVideos;
let videoActive = 0;

function charger() {
  fetch(DATA_URL + '?t=' + Date.now())
    .then(r => r.json())
    .then(d => {
      if (d.videos && d.videos.length > 0) videos = d.videos;
      afficher();
    })
    .catch(() => afficher());
}

function afficher() {
  const grid = document.getElementById('videos-grid');
  grid.innerHTML = '';

  videos.forEach((v, i) => {
    const card = document.createElement('div');
    card.className = 'video-card' + (i === videoActive ? ' active' : '');
    card.onclick = () => jouer(i);
    card.innerHTML = `
      <div class="video-thumb">
        <span style="font-size:48px;">${v.emoji || '🎬'}</span>
        <div class="play-btn">▶</div>
      </div>
      <div class="video-card-info">
        <div class="video-card-title">${v.titre}</div>
        <div class="video-card-desc">${v.desc}</div>
      </div>`;
    grid.appendChild(card);
  });

  // Afficher la première vidéo
  if (videos.length > 0) jouer(0);
}

function jouer(i) {
  videoActive = i;
  const v = videos[i];
  document.getElementById('main-iframe').src =
    `https://drive.google.com/file/d/${v.driveId}/preview`;
  document.getElementById('main-title').textContent = v.titre;
  document.getElementById('main-desc').textContent  = v.desc;

  document.querySelectorAll('.video-card').forEach((c, idx) => {
    c.classList.toggle('active', idx === i);
  });
}

charger();
</script>
</body>
</html>
