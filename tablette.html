<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petit Sudiste 13</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap');

  /* ===== CONFIGURATION ===== */
  /* Remplace "TON_GITHUB_USERNAME" et "TON_REPO_NAME" par les tiens */
  /* ========================= */

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --accent: #c9a96e;
    --accent2: #7eb8c9;
    --text: #f0ede8;
    --muted: #8b8fa8;
    --border: rgba(255,255,255,0.08);
    --green: #6fcf97;
    --red: #eb5757;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  #app {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    width: 100vw;
  }

  /* HEADER */
  .top-bar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 16px 32px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .prop-name {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    color: var(--accent);
    letter-spacing: 0.04em;
  }

  .clock-block { text-align: center; }

  .clock-time {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.02em;
  }

  .clock-date {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 3px;
  }

  .wifi-block { text-align: right; }
  .wifi-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .wifi-ssid  { font-size: 14px; font-weight: 500; }
  .wifi-pass  { font-size: 12px; color: var(--accent2); }

  /* MAIN */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 14px;
    padding: 18px 24px;
    overflow: hidden;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    position: relative;
    overflow: hidden;
  }

  .card-full { grid-column: 1 / -1; }

  .card-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-label::before {
    content: '';
    width: 18px; height: 1px;
    background: var(--accent);
    display: inline-block;
    flex-shrink: 0;
  }

  /* ANNONCE */
  .annonce-tag {
    display: inline-block;
    background: rgba(201,169,110,0.15);
    color: var(--accent);
    font-size: 10px;
    padding: 3px 12px;
    border-radius: 20px;
    border: 1px solid rgba(201,169,110,0.3);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .annonce-text {
    font-size: 18px;
    font-weight: 300;
    line-height: 1.6;
  }

  .card-accent-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  /* MÉTÉO */
  .meteo-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 4px;
  }

  .meteo-icon { font-size: 40px; line-height: 1; }

  .meteo-temp {
    font-family: 'Playfair Display', serif;
    font-size: 40px;
    font-weight: 400;
    line-height: 1;
  }

  .meteo-desc { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .meteo-extra {
    display: flex;
    gap: 16px;
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
  }

  .meteo-extra span { color: var(--text); }

  /* RÈGLES */
  .rules-list { list-style: none; margin-top: 4px; }

  .rules-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--muted);
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    line-height: 1.4;
  }

  .rules-list li:last-child { border-bottom: none; padding-bottom: 0; }

  .rule-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    flex-shrink: 0;
  }

  .rule-ok { background: rgba(111,207,151,0.15); color: var(--green); }
  .rule-no { background: rgba(235,87,87,0.15);   color: var(--red); }

  /* FOOTER */
  .bottom-bar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .checkout-text { font-size: 12px; color: var(--muted); }
  .checkout-text strong { color: var(--accent); font-size: 14px; }

  .infos-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .info-item {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .info-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
  }

  .info-item .val { color: var(--text); font-size: 12px; }

  /* HIDDEN */
  .hidden { display: none !important; }

  /* ALERTE URGENTE */
  .alerte-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #c0392b;
    z-index: 50;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    overflow-y: auto;
    animation: pulse-bg 2s ease-in-out infinite;
  }

  .alerte-overlay.active { display: flex; }

  @keyframes pulse-bg {
    0%, 100% { background: #c0392b; }
    50%       { background: #e74c3c; }
  }

  .alerte-icon {
    font-size: 60px;
    margin-bottom: 16px;
    animation: bounce 1s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-10px); }
  }

  .alerte-titre {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 500;
    color: white;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 20px;
  }

  .alerte-message {
    font-size: 24px;
    font-weight: 500;
    color: white;
    text-align: center;
    line-height: 1.5;
    max-width: 800px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  .alerte-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 6px;
    background: rgba(255,255,255,0.4);
    animation: progress 30s linear forwards;
  }

  @keyframes progress {
    from { width: 100%; }
    to   { width: 0%; }
  }

  .alerte-confirm-btn {
    margin-top: 36px;
    padding: 16px 48px;
    background: white;
    color: #c0392b;
    border: none;
    border-radius: 50px;
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.02em;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    transition: transform 0.1s, opacity 0.1s;
  }

  .alerte-confirm-btn:active { transform: scale(0.97); opacity: 0.9; }

  /* BOUTON JEUX */
  .jeux-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(201,169,110,0.12);
    border: 1px solid rgba(201,169,110,0.3);
    color: var(--accent);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 20px;
    border-radius: 24px;
    cursor: pointer;
    text-decoration: none;
    letter-spacing: 0.02em;
    transition: background 0.15s;
  }

  .jeux-btn:hover { background: rgba(201,169,110,0.2); }
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>emailjs.init('V4odHXmxPiUAdZLss');</script>
</head>
<body>
<!-- ALERTE URGENTE -->
<div class="alerte-overlay" id="alerte-overlay">
  <div class="alerte-icon">🚨</div>
  <div class="alerte-titre">Message urgent</div>
  <div class="alerte-message" id="alerte-message"></div>
  <button class="alerte-confirm-btn" id="alerte-confirm-btn" onclick="confirmerAlerte()">✓ J'ai compris</button>
  <div class="alerte-bar" id="alerte-bar"></div>
</div>

<div id="app">

  <div class="top-bar">
    <div class="prop-name" id="prop-name">Petit Sudiste 13</div>
    <div class="clock-block">
      <div class="clock-time" id="clock-time">--:--</div>
      <div class="clock-date" id="clock-date">---</div>
    </div>
    <div class="wifi-block" id="wifi-block">
      <div class="wifi-label">Wi-Fi</div>
      <div class="wifi-ssid" id="wifi-ssid">---</div>
      <div class="wifi-pass" id="wifi-pass">---</div>
    </div>
  </div>

  <div class="main-grid">
    <div class="card card-full" id="card-annonce">
      <div class="card-label">Message du propriétaire</div>
      <div class="annonce-tag" id="annonce-tag">Bienvenue</div>
      <div class="annonce-text" id="annonce-text">Chargement…</div>
      <div class="card-accent-bar"></div>
    </div>

    <div class="card" id="card-meteo">
      <div class="card-label">Météo locale</div>
      <div class="meteo-row">
        <div class="meteo-icon" id="meteo-icon">⏳</div>
        <div>
          <div class="meteo-temp" id="meteo-temp">--°</div>
          <div class="meteo-desc" id="meteo-desc">Chargement…</div>
        </div>
      </div>
      <div class="meteo-extra">
        Vent : <span id="meteo-vent">--</span> &nbsp; Humidité : <span id="meteo-hum">--</span>
      </div>
    </div>

    <div class="card" id="card-regles">
      <div class="card-label">Règles du logement</div>
      <ul class="rules-list" id="rules-list"></ul>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="checkout-text">Check-out : <strong id="checkout-text">---</strong></div>
    <div class="infos-row" id="infos-row"></div>
    <a class="jeux-btn" href="sorties.html">🗺️ Sorties</a>
    <a class="jeux-btn" href="jeux.html">🎮 Jeux</a>
  </div>

</div>

<script>
  // ============================================================
  // CONFIGURATION — remplace ces deux valeurs par les tiennes
  // ============================================================
  const GITHUB_USER = "mediapan";
  const GITHUB_REPO = "petit-sudiste-tablette";
  // ============================================================

  const DATA_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/data.json`;

  // Horloge
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock-time').textContent = h + ':' + m;
    const jours   = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    const mois    = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    document.getElementById('clock-date').textContent =
      jours[now.getDay()] + ' ' + now.getDate() + ' ' + mois[now.getMonth()];
  }
  updateClock();
  setInterval(updateClock, 10000);

  // Météo (Open-Meteo, gratuit, sans clé API)
  function loadMeteo(lat, lon, ville) {
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relativehumidity_2m&wind_speed_unit=kmh`)
      .then(r => r.json())
      .then(d => {
        const w = d.current_weather;
        const icons = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',61:'🌧️',71:'❄️',80:'🌧️',95:'⛈️'};
        const descs = {0:'Ensoleillé',1:'Peu nuageux',2:'Partiellement nuageux',3:'Couvert',45:'Brouillard',51:'Bruine légère',61:'Pluie',71:'Neige',80:'Averses',95:'Orageux'};
        const code = w.weathercode;
        document.getElementById('meteo-icon').textContent = icons[code] || '🌡️';
        document.getElementById('meteo-temp').textContent = Math.round(w.temperature) + '°';
        document.getElementById('meteo-desc').textContent = (descs[code] || 'Variable') + ' · ' + ville;
        document.getElementById('meteo-vent').textContent = Math.round(w.windspeed) + ' km/h';
        const hum = d.hourly?.relativehumidity_2m?.[new Date().getHours()] ?? '--';
        document.getElementById('meteo-hum').textContent = hum + '%';
      })
      .catch(() => {
        document.getElementById('meteo-desc').textContent = 'Météo indisponible';
      });
  }

  // Chargement des données depuis GitHub
  function loadData() {
    fetch(DATA_URL + '?t=' + Date.now())
      .then(r => r.json())
      .then(d => {
        // Nom
        document.getElementById('prop-name').textContent = d.nom;
        document.title = d.nom;

        // Annonce
        document.getElementById('annonce-tag').textContent  = d.annonce.tag;
        document.getElementById('annonce-text').textContent = d.annonce.texte;

        // WiFi
        if (d.sections.wifi) {
          document.getElementById('wifi-ssid').textContent = d.wifi.ssid;
          document.getElementById('wifi-pass').textContent = 'mdp : ' + d.wifi.password;
          document.getElementById('wifi-block').classList.remove('hidden');
        } else {
          document.getElementById('wifi-block').classList.add('hidden');
        }

        // Météo
        if (d.sections.meteo) {
          document.getElementById('card-meteo').classList.remove('hidden');
          loadMeteo(d.lat, d.lon, d.ville);
        } else {
          document.getElementById('card-meteo').classList.add('hidden');
        }

        // Règles
        if (d.sections.regles) {
          document.getElementById('card-regles').classList.remove('hidden');
          const ul = document.getElementById('rules-list');
          ul.innerHTML = '';
          d.regles.forEach(r => {
            const li = document.createElement('li');
            li.innerHTML = `<span class="rule-dot ${r.ok ? 'rule-ok' : 'rule-no'}">${r.ok ? '✓' : '✗'}</span> ${r.texte}`;
            ul.appendChild(li);
          });
        } else {
          document.getElementById('card-regles').classList.add('hidden');
        }

        // Check-out
        document.getElementById('checkout-text').textContent = d.checkout;

        // Infos pratiques
        if (d.sections.infos) {
          const row = document.getElementById('infos-row');
          row.innerHTML = '';
          d.infos.forEach(i => {
            const div = document.createElement('div');
            div.className = 'info-item';
            div.innerHTML = `<span class="info-dot"></span>${i.label} : <span class="val">${i.valeur}</span>`;
            row.appendChild(div);
          });
        }

        // ALERTE URGENTE
        const overlay = document.getElementById('alerte-overlay');
        const messageActuel = d.alerte && d.alerte.message ? d.alerte.message : '';
        const cookieConfirme = document.cookie.split(';').find(c => c.trim().startsWith('alerte_msg='));
        const msgConfirme = cookieConfirme ? decodeURIComponent(cookieConfirme.split('=')[1].trim()) : '';
        if (d.alerte && d.alerte.active && messageActuel && msgConfirme !== messageActuel) {
          document.getElementById('alerte-message').textContent = messageActuel;
          overlay.classList.add('active');
          const bar = document.getElementById('alerte-bar');
          bar.style.animation = 'none';
          bar.offsetHeight;
          bar.style.animation = 'progress 30s linear forwards';
        } else {
          overlay.classList.remove('active');
        }
      })
      .catch(() => console.log('Erreur chargement data'));
  }

  loadData();
  // Rechargement toutes les 30 secondes
  setInterval(loadData, 30000);

  // Confirmation alerte par le locataire
  function confirmerAlerte() {
    const msgActuel = document.getElementById('alerte-message').textContent;
    document.getElementById('alerte-overlay').classList.remove('active');

    // Cookie 7 jours
    const expire = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toUTCString();
    document.cookie = `alerte_msg=${encodeURIComponent(msgActuel)}; expires=${expire}; path=/`;

    // Envoi email via EmailJS
    const now = new Date();
    const date = now.toLocaleDateString('fr-FR') + ' à ' + now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    emailjs.send('service_oawv7mi', 'template_wuz31w9', {
      message: msgActuel,
      date: date
    }).catch(() => console.log('Email non envoyé'));
  }
</script>
</body>
</html>
