<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petit Sudiste 13</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap');

  :root {
    --bg: #0a0a1a;
    --surface: #12122a;
    --surface2: #1a1a3a;
    --accent: #ff2d78;
    --accent2: #00e5cc;
    --accent3: #ffe600;
    --text: #f5f0ff;
    --muted: #a090c0;
    --border: rgba(255,45,120,0.2);
    --green: #00e5cc;
    --red: #ff2d78;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }

  /* Fond dégradé tropical */
  body { background: linear-gradient(160deg, #0d0030 0%, #0a0a1a 30%, #001a2e 60%, #0d1a00 100%); }

  #app { display: grid; grid-template-rows: auto auto auto 1fr auto; height: 100vh; width: 100vw; }

  /* HEADER */
  .top-bar {
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; padding: 14px 28px 12px;
    background: linear-gradient(135deg, #1a0030, #0d0830, #001a30);
    border-bottom: 2px solid rgba(255,45,120,0.4);
  }

  .prop-name { font-family: 'Playfair Display', serif; font-size: 19px; color: var(--accent); letter-spacing: 0.04em; }

  .meteo-topbar { display: flex; align-items: center; gap: 10px; }

  .alerte-meteo-item {
    font-size: 19px; font-weight: 500;
    padding: 2px 8px; border-radius: 10px;
    background: rgba(255,68,34,0.2);
    border: 1px solid rgba(255,68,34,0.4);
    color: #ff6644;
    margin-top: 3px;
    display: inline-block;
  }

  .clock-block { text-align: center; }
  .clock-time { font-family: 'Playfair Display', serif; font-size: 44px; font-weight: 400; line-height: 1; }
  .clock-date { font-size: 17px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 3px; }

  .wifi-block { text-align: right; }
  .wifi-label { font-size: 19px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .wifi-ssid  { font-size: 17px; font-weight: 500; }
  .wifi-pass  { font-size: 15px; color: #00e5cc; }

  /* CONTENU PRINCIPAL */
  .main-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 12px;
    padding: 14px 20px;
    overflow: hidden;
  }

  .card {
    background: rgba(18,18,42,0.95); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 18px;
    position: relative; overflow: hidden;
  }

  .card-full { grid-column: 1 / -1; }
  .card-tall { grid-row: 1 / 3; }

  .card-label {
    font-size: 17px; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted); margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-label::before { content: ''; width: 18px; height: 1px; background: linear-gradient(135deg, #ff2d78, #ff6eb0); display: inline-block; }

  .annonce-tag {
    display: inline-block;
    background: rgba(255,45,120,0.2); color: #ff6eb0;
    font-size: 19px; padding: 3px 12px; border-radius: 20px;
    border: 1px solid rgba(255,45,120,0.4); margin-bottom: 10px;
    text-transform: uppercase; letter-spacing: 0.08em;
  }

  .annonce-text { font-size: 17px; font-weight: 300; line-height: 1.6; }

  .card-accent-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, #ff2d78, #00e5cc, #ffe600); }

  /* MÉTÉO */
  .meteo-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .meteo-icon { font-size: 44px; line-height: 1; }
  .meteo-temp { font-family: 'Playfair Display', serif; font-size: 44px; font-weight: 400; line-height: 1; }
  .meteo-desc { font-size: 17px; color: var(--muted); margin-top: 3px; }
  .meteo-extra { display: flex; gap: 12px; margin-top: 8px; font-size: 17px; color: var(--muted); }
  .meteo-extra span { color: var(--text); }

  /* RÈGLES */
  .rules-list { list-style: none; margin-top: 4px; }
  .rules-list li { font-size: 17px; color: var(--muted); padding: 5px 0; border-bottom: 1px solid var(--border); line-height: 1.4; }
  .rules-list li:last-child { border-bottom: none; }

  /* BARRE INFO COMPACTE */
  .info-bar {
    display: grid;
    grid-template-columns: 2fr 1fr 1.5fr;
    gap: 24px;
    padding: 8px 28px;
    background: rgba(18,18,42,0.95);
    border-top: 12px solid var(--bg);
    border-bottom: 1px solid var(--border);
  }

  .info-bar-left { display: flex; flex-direction: column; justify-content: center; gap: 6px; }

  .annonce-text-sm { font-size: 26px; font-weight: 300; line-height: 1.4; color: var(--text); }

  .info-bar {
    display: block;
    padding: 12px 28px;
    background: rgba(18,18,42,0.95);
    border-top: 12px solid var(--bg);
    border-bottom: 1px solid var(--border);
    width: 100%;
  }

  .info-bar-left { display: flex; flex-direction: column; gap: 6px; width: 100%; }

  .info-bar-left {
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
  }

  .info-bar-bottom {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 24px;
  }

  .info-bar-meteo { display: flex; align-items: center; gap: 10px; border-right: 1px solid var(--border); padding-right: 24px; }

  .meteo-icon-sm { font-size: 44px; line-height: 1; }
  .meteo-temp-sm { font-family: 'Playfair Display', serif; font-size: 44px; line-height: 1; }
  .meteo-desc-sm { font-size: 17px; color: var(--muted); margin-top: 2px; }
  .meteo-extra-sm { font-size: 19px; color: var(--muted); margin-top: 3px; }
  .meteo-extra-sm span { color: var(--text); }

  .info-bar-regles { padding-left: 0; }
  .regles-label { font-size: 17px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 6px; }

  .rules-list-sm { list-style: none; }
  .rules-list-sm li { font-size: 17px; color: var(--muted); padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.04); line-height: 1.3; }
  .rules-list-sm li:last-child { border-bottom: none; }

  /* GRANDES CARTES NAV */
  .nav-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    padding: 16px 20px;
  }

  .nav-card {
    background: rgba(18,18,42,0.95); border: 1px solid var(--border);
    border-radius: 20px; padding: 28px 16px;
    text-decoration: none; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; cursor: pointer; transition: transform 0.15s, border-color 0.15s;
    position: relative; overflow: hidden;
  }

  .nav-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.2); }
  .nav-card-icon  { font-size: 52px; line-height: 1; }
  .nav-card-title { font-size: 19px; font-weight: 500; text-align: center; }
  .nav-card-desc  { font-size: 15px; color: var(--muted); text-align: center; line-height: 1.4; }
  .nav-card-bar   { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; }

  .nav-sorties { background: linear-gradient(135deg, rgba(0,229,204,0.2), rgba(0,212,200,0.04)); border-color: rgba(0,229,204,0.3); }
  .nav-sorties .nav-card-bar { background: linear-gradient(90deg, #00e5cc, #00ffaa); }
  .nav-sorties .nav-card-title { color: #00e5cc; }

  .nav-menage { background: linear-gradient(135deg, rgba(255,45,120,0.2), rgba(255,140,58,0.04)); border-color: rgba(255,45,120,0.3); }
  .nav-menage .nav-card-bar { background: linear-gradient(90deg, #ff2d78, #ff6eb0); }
  .nav-menage .nav-card-title { color: #ff6eb0; }

  .nav-jeux { background: linear-gradient(135deg, rgba(255,230,0,0.2), rgba(255,214,102,0.04)); border-color: rgba(255,230,0,0.3); }
  .nav-jeux .nav-card-bar { background: linear-gradient(90deg, #ffe600, #ff9500); }
  .nav-jeux .nav-card-title { color: #ffe600; }

  .nav-video { background: linear-gradient(135deg, rgba(255,45,120,0.2), rgba(255,85,51,0.04)); border-color: rgba(255,45,120,0.3); }
  .nav-video .nav-card-bar { background: linear-gradient(90deg, #ff6400, #ff2d78); }
  .nav-video .nav-card-title { color: #ff6eb0; }

  .nav-infos { background: linear-gradient(135deg, rgba(0,229,204,0.2), rgba(77,219,128,0.04)); border-color: rgba(0,229,204,0.3); }
  .nav-infos .nav-card-bar { background: linear-gradient(90deg, #00e5cc, #00ffaa); }
  .nav-infos .nav-card-title { color: #00e5cc; }

  .nav-regles { background: linear-gradient(135deg, rgba(255,230,0,0.2), rgba(200,240,0,0.04)); border-color: rgba(255,230,0,0.3); }
  .nav-regles .nav-card-bar { background: linear-gradient(90deg, #ffe600, #ff9500); }
  .nav-regles .nav-card-title { color: #ffe600; }

  /* POPUP RÈGLES */
  .regles-popup {
    display: none; position: fixed;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(18,18,42,0.95); border: 1px solid var(--border);
    border-radius: 20px; padding: 24px 28px;
    z-index: 40; min-width: 360px; max-width: 500px; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .regles-popup.show { display: block; }
  .regles-popup-title {
    font-family: 'Playfair Display', serif; font-size: 18px;
    color: var(--green); margin-bottom: 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .regles-popup-close { cursor: pointer; font-size: 18px; background: none; border: none; color: var(--muted); }
  .regles-popup-item {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 8px 0; border-bottom: 1px solid var(--border);
    font-size: 19px; color: var(--text); line-height: 1.5;
  }
  .regles-popup-item:last-child { border-bottom: none; }

  /* BANDEAU DÉFILANT */
  .ticker-wrap {
    background: rgba(18,18,42,0.95);
    border-top: 1px solid var(--border);
    overflow: hidden;
    white-space: nowrap;
    padding: 8px 0;
    display: flex;
    align-items: center;
  }

  .ticker-track {
    display: inline-block;
    animation: ticker 30s linear infinite;
  }

  .ticker-track:hover { animation-play-state: paused; }

  @keyframes ticker {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .ticker-item {
    display: inline-block;
    padding: 0 40px;
    font-size: 19px;
    color: var(--accent);
    font-weight: 400;
  }

  .ticker-sep {
    display: inline-block;
    color: var(--muted);
    opacity: 0.4;
    font-size: 19px;
    vertical-align: middle;
  }

  /* FOOTER */
  .bottom-bar {
    background: rgba(18,18,42,0.95); border-top: 1px solid var(--border);
    padding: 8px 20px; display: flex;
    justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  }

  .checkout-text { font-size: 17px; color: var(--muted); }
  .checkout-text strong { color: #ff6eb0; font-size: 19px; }

  .infos-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .info-item { font-size: 17px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .info-dot  { width: 5px; height: 5px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .info-item .val { color: var(--text); font-size: 17px; }

  /* ALERTE URGENTE */
  .alerte-overlay {
    display: none; position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #c0392b; z-index: 50;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 40px; overflow-y: auto;
    animation: pulse-bg 2s ease-in-out infinite;
  }
  .alerte-overlay.active { display: flex; }

  @keyframes pulse-bg { 0%,100%{background:#c0392b} 50%{background:#e74c3c} }

  .alerte-icon { font-size: 60px; margin-bottom: 16px; animation: bounce 1s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

  .alerte-titre { font-family:'Playfair Display',serif; font-size:24px; color:white; text-transform:uppercase; letter-spacing:0.1em; margin-bottom:16px; }
  .alerte-message { font-size:24px; font-weight:500; color:white; text-align:center; line-height:1.5; max-width:800px; text-shadow:0 2px 8px rgba(0,0,0,0.3); }

  .alerte-confirm-btn {
    margin-top:32px; padding:16px 48px; background:white; color:#c0392b;
    border:none; border-radius:50px; font-family:'DM Sans',sans-serif;
    font-size:18px; font-weight:600; cursor:pointer;
    box-shadow:0 4px 20px rgba(0,0,0,0.2); transition:transform 0.1s;
  }
  .alerte-confirm-btn:active { transform:scale(0.97); }

  .alerte-bar { position:absolute; bottom:0; left:0; right:0; height:6px; background:rgba(255,255,255,0.4); animation:progress 30s linear forwards; }
  @keyframes progress { from{width:100%} to{width:0%} }

  /* FEUILLES */
  .leaf { position:fixed; pointer-events:none; z-index:0; }
  .leaf-1 { top: 2%;  right: 1%;  font-size: 120px; opacity: 0.15; transform: rotate(10deg); }
  .leaf-2 { top: 25%; right: 2%;  font-size: 80px;  opacity: 0.12; transform: scaleX(-1); }
  .leaf-3 { top: 55%; right: 1%;  font-size: 90px;  opacity: 0.12; }
  .leaf-4 { top: 2%;  left: 1%;   font-size: 110px; opacity: 0.15; transform: rotate(-10deg) scaleX(-1); }
  .leaf-5 { top: 30%; left: 2%;   font-size: 70px;  opacity: 0.1; }
  .leaf-6 { top: 60%; left: 1%;   font-size: 85px;  opacity: 0.12; }

  /* POPUP INFOS */
  .infos-popup {
    display: none; position: fixed;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(18,18,42,0.95); border: 1px solid var(--border);
    border-radius: 20px; padding: 24px 28px;
    z-index: 40; min-width: 320px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .infos-popup.show { display: block; }
  .infos-popup-title {
    font-family: 'Playfair Display', serif; font-size: 18px;
    color: var(--green); margin-bottom: 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .infos-popup-close { cursor: pointer; font-size: 18px; color: var(--muted); background: none; border: none; color: var(--muted); }
  .infos-popup-list { display: flex; flex-direction: column; gap: 10px; }
  .infos-popup-item { display: flex; gap: 10px; align-items: center; font-size: 17px; }
  .infos-popup-label { color: var(--muted); font-size: 15px; min-width: 80px; }
  .infos-popup-val { color: var(--text); font-weight: 500; }
  .infos-overlay { display: none; position: fixed; top:0;left:0;right:0;bottom:0; background: rgba(0,0,0,0.5); z-index: 39; }
  .infos-overlay.show { display: block; }

  .hidden { display:none !important; }
</style>
</head>
<body>

<div class="leaf leaf-1">🌿</div>
<div class="leaf leaf-2">🌴</div>

<!-- POPUP RÈGLES -->
<div class="infos-overlay" id="regles-overlay" onclick="toggleRegles()"></div>
<div class="regles-popup" id="regles-popup">
  <div class="regles-popup-title">
    📋 Règles du logement
    <button class="regles-popup-close" onclick="toggleRegles()">✕</button>
  </div>
  <div id="regles-popup-list"></div>
</div>

<!-- POPUP INFOS -->
<div class="infos-overlay" id="infos-overlay" onclick="toggleInfos()"></div>
<div class="infos-popup" id="infos-popup">
  <div class="infos-popup-title">
    ℹ️ Infos pratiques
    <button class="infos-popup-close" onclick="toggleInfos()">✕</button>
  </div>
  <div class="infos-popup-list" id="infos-popup-list"></div>

<script>
  const GITHUB_USER = "mediapan";
  const GITHUB_REPO = "petit-sudiste-tablette";
  const DATA_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/data.json`;

  function afficherMessage(msg) {
    document.getElementById('annonce-text').textContent = msg.texte || '';
  }

  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock-time').textContent = h + ':' + m;
    const jours = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    const mois  = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    document.getElementById('clock-date').textContent = jours[now.getDay()] + ' ' + now.getDate() + ' ' + mois[now.getMonth()];
  }
  updateClock();
  setInterval(updateClock, 10000);

  function loadMeteo(lat, lon, ville) {
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relativehumidity_2m&wind_speed_unit=kmh&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Europe%2FParis`)
      .then(r => r.json())
      .then(d => {
        const w = d.current_weather;
        const icons = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',61:'🌧️',71:'❄️',80:'🌧️',95:'⛈️'};
        const descs = {0:'Ensoleillé',1:'Peu nuageux',2:'Partiellement nuageux',3:'Couvert',45:'Brouillard',51:'Bruine légère',61:'Pluie',71:'Neige',80:'Averses',95:'Orageux'};
        const code = w.weathercode;
        const temp = Math.round(w.temperature);
        const vent = Math.round(w.windspeed);

        document.getElementById('meteo-icon').textContent = icons[code] || '🌡️';
        document.getElementById('meteo-temp').textContent = temp + '°';
        document.getElementById('meteo-desc').textContent = (descs[code] || 'Variable') + ' · ' + ville;
        document.getElementById('meteo-vent').textContent = vent + ' km/h';
        const hum = d.hourly?.relativehumidity_2m?.[new Date().getHours()] ?? '--';
        document.getElementById('meteo-hum').textContent = hum + '%';

        if (d.daily && d.daily.weathercode.length > 1) {
          const codeDemain = d.daily.weathercode[1];
          const maxD = Math.round(d.daily.temperature_2m_max[1]);
          const minD = Math.round(d.daily.temperature_2m_min[1]);
          document.getElementById('meteo-demain').textContent = `Demain : ${icons[codeDemain]||'🌡️'} ${descs[codeDemain]||'Variable'} · ${minD}° / ${maxD}°`;
          document.getElementById('meteo-demain').style.display = 'block';
        }

        // ALERTES AUTOMATIQUES
        const alertes = [];
        if (temp >= 38)        alertes.push({ emoji:'🔴', msg:'Canicule extrême — Hydratez-vous, évitez de sortir' });
        else if (temp >= 35)   alertes.push({ emoji:'🟠', msg:'Forte chaleur — Restez hydratés et à l\'ombre' });
        else if (temp <= -2)   alertes.push({ emoji:'🔵', msg:'Gel — Prudence sur les routes et les sols' });
        if (vent >= 100)       alertes.push({ emoji:'🔴', msg:'Tempête violente — Restez à l\'intérieur' });
        else if (vent >= 70)   alertes.push({ emoji:'🟠', msg:'Vents forts — Évitez les zones exposées' });
        else if (vent >= 50)   alertes.push({ emoji:'🟡', msg:'Vent soutenu — Prudence en extérieur' });
        if ([95,96,99].includes(code)) alertes.push({ emoji:'⛈️', msg:'Orages — Évitez les espaces découverts' });
        if ([71,73,75,77].includes(code)) alertes.push({ emoji:'❄️', msg:'Chutes de neige — Prudence sur les routes' });
        if ([45,48].includes(code)) alertes.push({ emoji:'🌫️', msg:'Brouillard dense — Réduisez la vitesse' });

        const alertEl = document.getElementById('meteo-alerte');
        if (alertes.length > 0) {
          alertEl.innerHTML = alertes.map(a =>
            `<div class="alerte-meteo-item">${a.emoji} ${a.msg}</div>`
          ).join('');
          alertEl.style.display = 'block';
        } else {
          alertEl.style.display = 'none';
        }
      })
      .catch(() => document.getElementById('meteo-desc').textContent = 'Météo indisponible');
  }

  function toggleRegles() {
    document.getElementById('regles-popup').classList.toggle('show');
    document.getElementById('regles-overlay').classList.toggle('show');
  }

  function toggleInfos() {
    document.getElementById('infos-popup').classList.toggle('show');
    document.getElementById('infos-overlay').classList.toggle('show');
  }

  function loadData() {
    fetch(DATA_URL + '?t=' + Date.now())
      .then(r => r.json())
      .then(d => {
        document.title = d.nom;

        // Messages en défilement avec filtre horaire
        const now = new Date();
        const heure = now.getHours() * 60 + now.getMinutes();

        function enPlage(msg) {
          if (!msg.heures) return true;
          const [hDe, mDe] = msg.heures.de.split(':').map(Number);
          const [hA,  mA]  = msg.heures.a.split(':').map(Number);
          const de = hDe * 60 + mDe;
          const a  = hA  * 60 + mA;
          return de <= a ? (heure >= de && heure < a) : (heure >= de || heure < a);
        }

        function bonJour(msg) {
          if (!msg.jours || msg.jours.length === 0) return true;
          // JS: 0=Dim, 1=Lun... → on convertit en 0=Lun, 6=Dim
          const jsJour = now.getDay();
          const jourIdx = jsJour === 0 ? 6 : jsJour - 1;
          return msg.jours.includes(jourIdx);
        }

        const msgs = (d.messages || []).filter(m => m.actif && enPlage(m) && bonJour(m));
        if (msgs.length > 0) {
          window._messages = msgs;
          if (!window._msgInterval) {
            window._msgIdx = 0;
            afficherMessage(msgs[0]);
            if (msgs.length > 1) {
              window._msgInterval = setInterval(() => {
                window._msgIdx = (window._msgIdx + 1) % window._messages.length;
                afficherMessage(window._messages[window._msgIdx]);
              }, 10000);
            }
          } else {
            window._messages = msgs;
          }
        } else if (d.annonce) {
          afficherMessage({ texte: d.annonce.texte });
        }

        if (d.sections.wifi) {
          document.getElementById('wifi-ssid').textContent = d.wifi.ssid;
          document.getElementById('wifi-pass').textContent = 'mdp : ' + d.wifi.password;
          document.getElementById('wifi-block').classList.remove('hidden');
        } else {
          document.getElementById('wifi-block').classList.add('hidden');
        }

        if (d.sections.meteo) {
          document.getElementById('card-meteo').classList.remove('hidden');
          loadMeteo(d.lat, d.lon, d.ville);
        } else {
          document.getElementById('card-meteo').classList.add('hidden');
        }

        if (d.sections.regles) {
          const popupRegles = document.getElementById('regles-popup-list');
          popupRegles.innerHTML = '';
          d.regles.forEach(r => {
            const div = document.createElement('div');
            div.className = 'regles-popup-item';
            div.innerHTML = `<span style="color:var(--green);flex-shrink:0;">•</span> ${r.texte}`;
            popupRegles.appendChild(div);
          });
        }
        document.getElementById('checkout-text').textContent = d.checkout;

        if (d.sections.infos) {
          const row = document.getElementById('infos-row');
          row.innerHTML = '';
          const popupList = document.getElementById('infos-popup-list');
          popupList.innerHTML = '';
          d.infos.forEach(i => {
            const div = document.createElement('div');
            div.className = 'info-item';
            div.innerHTML = `<span class="info-dot"></span>${i.label} : <span class="val">${i.valeur}</span>`;
            row.appendChild(div);
            const pi = document.createElement('div');
            pi.className = 'infos-popup-item';
            pi.innerHTML = `<span class="infos-popup-label">${i.label}</span><span class="infos-popup-val">${i.valeur}</span>`;
            popupList.appendChild(pi);
          });
        }

        // BANDEAU DÉFILANT
        const tickerWrap = document.getElementById('ticker-wrap');
        const tickerTrack = document.getElementById('ticker-track');
        const bandeaux = (d.bandeau || []).filter(b => b.actif);
        if (bandeaux.length > 0) {
          tickerWrap.style.display = 'block';
          const texte = bandeaux.map(b => `<span class="ticker-item">${b.texte}</span><span class="ticker-sep">✦</span>`).join('');
          tickerTrack.innerHTML = texte + texte; // double pour boucle continue
        } else {
          tickerWrap.style.display = 'none';
        }

        // Sections personnalisées
        const spContainer = document.getElementById('sections-perso-container');
        spContainer.innerHTML = '';
        if (d.sectionsPerso) {
          d.sectionsPerso.filter(s => s.actif).forEach(s => {
            const div = document.createElement('div');
            div.style.cssText = 'background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin:0 20px 12px;';
            div.innerHTML = `
              <div style="font-size:9px;text-transform:uppercase;letter-spacing:0.14em;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px;">
                <span style="width:18px;height:1px;background:var(--accent);display:inline-block;"></span>${s.titre}
              </div>
              <div style="font-size:13px;color:var(--text);line-height:1.6;white-space:pre-wrap;">${s.contenu}</div>`;
            spContainer.appendChild(div);
          });
        }

        // ALERTE URGENTE
        const overlay = document.getElementById('alerte-overlay');
        const messageActuel = d.alerte && d.alerte.message ? d.alerte.message : '';
        const msgConfirme = localStorage.getItem('alerte_confirmee_msg') || '';
        if (d.alerte && d.alerte.active && messageActuel && msgConfirme !== messageActuel) {
          document.getElementById('alerte-message').textContent = messageActuel;
          const wasActive = overlay.classList.contains('active');
          overlay.classList.add('active');
          const bar = document.getElementById('alerte-bar');
          bar.style.animation = 'none'; bar.offsetHeight;
          bar.style.animation = 'progress 30s linear forwards';
          // Jouer la sonnerie seulement si c'est un nouveau message
          if (!wasActive) jouerAlerteSound();
        } else {
          overlay.classList.remove('active');
        }
      })
      .catch(() => console.log('Erreur chargement data'));
  }

  let audioCtx = null;
  let alarmNodes = [];

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  document.addEventListener('touchstart', initAudio, { once: false });
  document.addEventListener('click', initAudio, { once: false });

  function jouerAlerteSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      stopAlerteSound();

      // Alarme continue — boucle de bips
      let t = audioCtx.currentTime;
      const duree = 60; // secondes de son continu
      const bips = [880, 660, 440];
      for (let i = 0; t + i * 0.4 < audioCtx.currentTime + duree; i++) {
        const freq = bips[i % bips.length];
        const osc  = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value = freq; osc.type = 'square';
        const start = t + i * 0.4;
        gain.gain.setValueAtTime(0.4, start);
        gain.gain.exponentialRampToValueAtTime(0.01, start + 0.3);
        osc.start(start);
        osc.stop(start + 0.35);
        alarmNodes.push(osc);
      }
    } catch(e) {
      console.log('Audio non disponible:', e);
    }
  }

  function stopAlerteSound() {
    alarmNodes.forEach(n => { try { n.stop(); } catch(e) {} });
    alarmNodes = [];
  }

  function confirmerAlerte() {
    const msgActuel = document.getElementById('alerte-message').textContent || 'Message urgent';
    document.getElementById('alerte-overlay').classList.remove('active');
    stopAlerteSound();
    localStorage.setItem('alerte_confirmee_msg', msgActuel);
    const now = new Date();
    const date = now.toLocaleDateString('fr-FR') + ' à ' + now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    emailjs.send('service_oawv7mi', 'template_wuz31w9', { message: msgActuel, date })
      .then(() => console.log('Email envoyé')).catch(() => console.log('Email non envoyé'));
  }

  loadData();
  setInterval(loadData, 10000);
</script>
