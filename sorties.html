<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorties — Petit Sudiste 13</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --accent: #c9a96e;
    --accent2: #7eb8c9;
    --text: #f0ede8;
    --muted: #8b8fa8;
    --border: rgba(255,255,255,0.08);
    --green: #6fcf97;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

  /* HEADER */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  .header-title { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--accent); }
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted);
    background: none; border: 1px solid var(--border);
    border-radius: 20px; padding: 7px 16px;
    font-family: 'DM Sans', sans-serif; cursor: pointer;
    text-decoration: none; transition: 0.15s;
  }
  .back-btn:hover { color: var(--text); }

  /* THÈMES */
  .themes-bar {
    display: flex; gap: 8px; padding: 16px 28px;
    overflow-x: auto; background: var(--surface);
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .themes-bar::-webkit-scrollbar { display: none; }

  .theme-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 18px; border-radius: 24px;
    border: 1px solid var(--border);
    background: transparent; color: var(--muted);
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    cursor: pointer; white-space: nowrap; transition: 0.15s;
    flex-shrink: 0;
  }
  .theme-btn.active {
    background: var(--accent); border-color: var(--accent);
    color: #1a1209; font-weight: 500;
  }

  /* CONTENU */
  .content { padding: 24px 28px; max-width: 1100px; margin: 0 auto; }

  .section-title {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted); margin-bottom: 18px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::before { content: ''; width: 20px; height: 1px; background: var(--accent); }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px; margin-bottom: 40px;
  }

  .place-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }
  .place-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.18); }

  .place-img {
    width: 100%; height: 170px; object-fit: cover;
    display: block; background: var(--surface2);
  }

  .place-img-placeholder {
    width: 100%; height: 170px;
    display: flex; align-items: center; justify-content: center;
    font-size: 48px;
    background: linear-gradient(135deg, #1a1d27, #22263a);
  }

  .place-body { padding: 14px 16px; }

  .place-name { font-size: 15px; font-weight: 500; margin-bottom: 4px; }

  .place-dist {
    font-size: 11px; color: var(--accent2);
    margin-bottom: 8px; display: flex; align-items: center; gap: 4px;
  }

  .place-desc { font-size: 12px; color: var(--muted); line-height: 1.55; margin-bottom: 10px; }

  .place-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }

  .ptag {
    font-size: 10px; padding: 3px 9px; border-radius: 12px;
    border: 1px solid var(--border); color: var(--muted);
  }
  .ptag-green { border-color: rgba(111,207,151,0.3); color: var(--green); background: rgba(111,207,151,0.08); }
  .ptag-gold  { border-color: rgba(201,169,110,0.3); color: var(--accent); background: rgba(201,169,110,0.08); }
  .ptag-blue  { border-color: rgba(126,184,201,0.3); color: var(--accent2); background: rgba(126,184,201,0.08); }

  .place-actions { display: flex; gap: 8px; }

  .place-btn {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-family: 'DM Sans', sans-serif;
    font-size: 12px; cursor: pointer; text-align: center; text-decoration: none;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    transition: 0.15s;
  }
  .place-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .place-btn.primary {
    background: rgba(201,169,110,0.12); border-color: rgba(201,169,110,0.3);
    color: var(--accent);
  }

  /* MODAL */
  .modal-overlay {
    display: none; position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85); z-index: 100;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface); border-radius: 20px;
    max-width: 540px; width: 100%; max-height: 90vh;
    overflow-y: auto; position: relative;
  }

  .modal-img {
    width: 100%; height: 220px; object-fit: cover;
    border-radius: 20px 20px 0 0;
  }
  .modal-img-placeholder {
    width: 100%; height: 220px;
    display: flex; align-items: center; justify-content: center;
    font-size: 64px;
    background: linear-gradient(135deg, #1a1d27, #22263a);
    border-radius: 20px 20px 0 0;
  }

  .modal-close {
    position: absolute; top: 14px; right: 14px;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(0,0,0,0.5); border: none; color: white;
    font-size: 16px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
  }

  .modal-body { padding: 20px 22px 24px; }
  .modal-name { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 6px; }
  .modal-dist { font-size: 12px; color: var(--accent2); margin-bottom: 14px; }
  .modal-desc { font-size: 14px; color: var(--muted); line-height: 1.65; margin-bottom: 16px; }

  .modal-infos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
  .modal-info-item {
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
  }
  .modal-info-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 3px; }
  .modal-info-val { font-size: 13px; color: var(--text); }

  .modal-map-btn {
    display: block; width: 100%; padding: 13px;
    background: var(--accent); color: #1a1209;
    border: none; border-radius: 10px; font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 500; cursor: pointer; text-align: center;
    text-decoration: none;
  }

  .hidden { display: none !important; }
</style>

let filtreCourant = 'tous';

function filtrer(theme) {
  filtreCourant = theme;
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  afficher();
}

function afficher() {
  const filtered = filtreCourant === 'tous' ? lieux : lieux.filter(l => l.theme === filtreCourant);
  const themes = {
    nature: { label: 'Nature & Randonnée', emoji: '🌿' },
    mer:    { label: 'Plages & Mer',        emoji: '🏖️' },
    culture:{ label: 'Culture & Histoire',  emoji: '🏛️' },
    gastro: { label: 'Gastronomie',         emoji: '🍽️' }
  };

  const content = document.getElementById('content');

  if (filtreCourant === 'tous') {
    const grouped = {};
    filtered.forEach(l => { if (!grouped[l.theme]) grouped[l.theme] = []; grouped[l.theme].push(l); });
    content.innerHTML = Object.entries(grouped).map(([theme, items]) => `
      <div class="section-title">${themes[theme].emoji} ${themes[theme].label}</div>
      <div class="cards-grid">${items.map(renderCard).join('')}</div>
    `).join('');
  } else {
    content.innerHTML = `
      <div class="section-title">${themes[filtreCourant].emoji} ${themes[filtreCourant].label}</div>
      <div class="cards-grid">${filtered.map(renderCard).join('')}</div>
    `;
  }
}

function renderCard(lieu) {
  const tags = lieu.tags.map(t => `<span class="ptag ${t.c ? 'ptag-'+t.c : ''}">${t.l}</span>`).join('');
  const img = `<div class="place-img-placeholder">${lieu.emoji}</div>`;
  return `
    <div class="place-card" onclick="ouvrirModal(${lieu.id})">
      ${img}
      <div class="place-body">
        <div class="place-name">${lieu.nom}</div>
        <div class="place-dist">📍 ${lieu.distance}</div>
        <div class="place-desc">${lieu.desc}</div>
        <div class="place-tags">${tags}</div>
        <div class="place-actions">
          <span class="place-btn primary">En savoir plus →</span>
          <a class="place-btn" href="${lieu.maps}" target="_blank" onclick="event.stopPropagation()">🗺️ Maps</a>
        </div>
      </div>
    </div>`;
}

function ouvrirModal(id) {
  const lieu = lieux.find(l => l.id === id);
  document.getElementById('modal-name').textContent = lieu.nom;
  document.getElementById('modal-dist').textContent = '📍 ' + lieu.distance;
  document.getElementById('modal-desc').textContent = lieu.desc_long;
  document.getElementById('modal-map').href = lieu.maps;
  document.getElementById('modal-img-zone').innerHTML = `<div class="modal-img-placeholder">${lieu.emoji}</div>`;
  document.getElementById('modal-infos').innerHTML = lieu.infos.map(i =>
    `<div class="modal-info-item"><div class="modal-info-label">${i.l}</div><div class="modal-info-val">${i.v}</div></div>`
  ).join('');
  document.getElementById('modal').classList.add('open');
}

function fermerModal(e) {
  if (!e || e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('open');
  }
}

afficher();
</script>
</body>
</html>
