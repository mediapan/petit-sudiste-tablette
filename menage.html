<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ménage départ — Petit Sudiste 13</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap');

    :root {
    --bg: #0a0a1a;
    --surface: #12122a;
    --surface2: #1a1a3a;
    --accent: #ff2d78;
    --accent2: #00e5cc;
    --accent3: #ffe600;
    --text: #f5f0ff;
    --muted: #a090c0;
    --border: rgba(255,45,120,0.2);
    --green: #00e5cc;
    --red: #ff2d78;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
  }

  .header-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px; color: var(--c5);
    display: flex; align-items: center; gap: 10px;
  }

  .back-btn {
    font-size: 15px; font-weight: 500;
    color: white;
    background: linear-gradient(135deg, #ff2d78, #ff6eb0);
    border: none;
    border-radius: 24px; padding: 10px 24px;
    font-family: 'DM Sans', sans-serif; cursor: pointer;
    text-decoration: none;
    box-shadow: 0 2px 12px rgba(200,240,0,0.3);
    transition: opacity 0.15s;
  }
  .back-btn:hover { opacity: 0.85; }

  /* PROGRESS */
  .progress-wrap {
    background: var(--surface);
    padding: 12px 24px 14px;
    border-bottom: 1px solid var(--border);
  }

  .progress-top {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--muted); margin-bottom: 8px;
  }

  .progress-top strong { color: var(--c5); }

  .progress-bar {
    height: 8px; background: rgba(255,255,255,0.07);
    border-radius: 8px; overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--c2), var(--c5));
    border-radius: 8px;
    transition: width 0.4s ease;
  }

  /* GRILLE CATÉGORIES */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
    padding: 20px 24px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .cat-card {
    background: var(--surface);
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .cat-header {
    padding: 14px 18px 12px;
    display: flex; align-items: center; gap: 10px;
  }

  .cat-icon { font-size: 24px; }

  .cat-title {
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.01em;
  }

  .cat-count {
    margin-left: auto;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    color: var(--muted);
  }

  /* couleurs par catégorie */
  .cat-0 .cat-header { background: linear-gradient(135deg, rgba(244,162,97,0.15), rgba(244,162,97,0.05)); border-bottom: 2px solid var(--c1); }
  .cat-0 .cat-title  { color: var(--c1); }
  .cat-1 .cat-header { background: linear-gradient(135deg, rgba(46,196,182,0.15), rgba(46,196,182,0.05)); border-bottom: 2px solid var(--c2); }
  .cat-1 .cat-title  { color: var(--c2); }
  .cat-2 .cat-header { background: linear-gradient(135deg, rgba(233,196,106,0.15), rgba(233,196,106,0.05)); border-bottom: 2px solid var(--c3); }
  .cat-2 .cat-title  { color: var(--c3); }
  .cat-3 .cat-header { background: linear-gradient(135deg, rgba(231,111,81,0.15), rgba(231,111,81,0.05)); border-bottom: 2px solid var(--c4); }
  .cat-3 .cat-title  { color: var(--c4); }
  .cat-4 .cat-header { background: linear-gradient(135deg, rgba(144,212,163,0.15), rgba(144,212,163,0.05)); border-bottom: 2px solid var(--c5); }
  .cat-4 .cat-title  { color: var(--c5); }

  /* ITEMS */
  .cat-items { padding: 10px 12px; }

  .check-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 8px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .check-item:last-child { border-bottom: none; }
  .check-item:hover { background: rgba(255,255,255,0.04); }

  .check-box {
    width: 26px; height: 26px; border-radius: 8px;
    border: 2px solid rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 14px; transition: 0.2s;
  }

  .cat-0 .check-item.done .check-box { background: var(--c1); border-color: var(--c1); }
  .cat-1 .check-item.done .check-box { background: var(--c2); border-color: var(--c2); }
  .cat-2 .check-item.done .check-box { background: var(--c3); border-color: var(--c3); }
  .cat-3 .check-item.done .check-box { background: var(--c4); border-color: var(--c4); }
  .cat-4 .check-item.done .check-box { background: var(--c5); border-color: var(--c5); }

  .check-text {
    font-size: 13px; color: var(--muted); line-height: 1.4;
    transition: 0.2s;
  }

  .check-item.done .check-text {
    color: rgba(240,237,232,0.4);
    text-decoration: line-through;
  }

  /* SUCCÈS */
  .success {
    display: none;
    margin: 0 24px 24px;
    background: linear-gradient(135deg, rgba(46,196,182,0.15), rgba(144,212,163,0.1));
    border: 1px solid rgba(144,212,163,0.3);
    border-radius: 18px;
    padding: 28px;
    text-align: center;
  }

  .success.show { display: block; }
  .success-icon { font-size: 56px; margin-bottom: 12px; }
  .success-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px; color: var(--c5); margin-bottom: 8px;
  }
  .success-sub { font-size: 14px; color: var(--muted); line-height: 1.6; }

  .reset-btn {
    margin-top: 18px;
    padding: 10px 28px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; cursor: pointer;
  }

  /* FEUILLES DÉCO */
    .leaf { position:fixed; pointer-events:none; z-index:0; }
  .leaf-1 { top: 2%;  right: 1%;  font-size: 120px; opacity: 0.15; transform: rotate(10deg); }
  .leaf-2 { top: 25%; right: 2%;  font-size: 80px;  opacity: 0.12; transform: scaleX(-1); }
  .leaf-3 { top: 55%; right: 1%;  font-size: 90px;  opacity: 0.12; }
  .leaf-4 { top: 2%;  left: 1%;   font-size: 110px; opacity: 0.15; transform: rotate(-10deg) scaleX(-1); }
  .leaf-5 { top: 30%; left: 2%;   font-size: 70px;  opacity: 0.1; }
  .leaf-6 { top: 60%; left: 1%;   font-size: 85px;  opacity: 0.12; }
</style>
</head>
<body>
<div class="leaf leaf-1">🌴</div>
<div class="leaf leaf-2">🦜</div>
<div class="leaf leaf-3">🌺</div>
<div class="leaf leaf-4">🌴</div>
<div class="leaf leaf-5">🌸</div>
<div class="leaf leaf-6">🦜</div>



<div class="header">
  <div class="header-title">🧹 Ménage départ</div>
  <a class="back-btn" href="tablette.html">← Retour</a>
</div>

<div class="progress-wrap">
  <div class="progress-top">
    Tâches effectuées <strong id="prog-text">0 / 0</strong>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="prog-fill" style="width:0%"></div>
  </div>
</div>

<div class="grid" id="grid"></div>
<div class="success" id="success">
  <div class="success-icon">🌺</div>
  <div class="success-title">Merci beaucoup !</div>
  <div class="success-sub">Tout est en ordre. Bon retour chez vous<br>et à très bientôt au Petit Sudiste 13 !</div>
  <button class="reset-btn" onclick="reset()">↺ Recommencer</button>
</div>

<script>
const GITHUB_USER = 'mediapan';
const GITHUB_REPO = 'petit-sudiste-tablette';
const DATA_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/data.json`;

const defaultTaches = [
  { cat: "Poubelles", emoji: "🗑️", items: ["Vider toutes les poubelles de la maison", "Sortir les poubelles au point de collecte", "Remettre les poubelles vides à leur place"] },
  { cat: "Cuisine", emoji: "🍽️", items: ["Laver et ranger la vaisselle", "Nettoyer le plan de travail et l'évier", "Nettoyer le four / micro-ondes si utilisé", "Vider et nettoyer le réfrigérateur", "Balayer et nettoyer le sol"] },
  { cat: "Chambres", emoji: "🛏️", items: ["Retirer les draps et taies d'oreiller", "Plier les draps et les déposer dans le panier", "Aérer les matelas"] },
  { cat: "Salle de bain", emoji: "🚿", items: ["Nettoyer la douche / baignoire", "Nettoyer le lavabo et les robinets", "Vider la poubelle de salle de bain", "Essuyer le miroir"] },
  { cat: "Général", emoji: "🏠", items: ["Fermer toutes les fenêtres", "Éteindre toutes les lumières", "Vérifier que la clim / chauffage est éteint", "Déposer les clés sur la table", "Dernier tour — vérifier qu'on n'a rien oublié"] }
];

let taches = [];
let etat = {};

function charger() {
  fetch(DATA_URL + '?t=' + Date.now())
    .then(r => r.json())
    .then(d => { taches = d.menage && d.menage.length ? d.menage : defaultTaches; afficher(); })
    .catch(() => { taches = defaultTaches; afficher(); });
}

function afficher() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  taches.forEach((section, si) => {
    const card = document.createElement('div');
    card.className = `cat-card cat-${si % 5}`;
    card.innerHTML = `
      <div class="cat-header">
        <span class="cat-icon">${section.emoji || '📋'}</span>
        <span class="cat-title">${section.cat}</span>
        <span class="cat-count" id="count-${si}">0 / ${section.items.length}</span>
      </div>
      <div class="cat-items">
        ${section.items.map((item, ii) => `
          <div class="check-item${etat[si+'-'+ii] ? ' done' : ''}" onclick="toggle(${si},${ii},this)">
            <div class="check-box">${etat[si+'-'+ii] ? '✓' : ''}</div>
            <div class="check-text">${item}</div>
          </div>`).join('')}
      </div>`;
    grid.appendChild(card);
    updateCount(si);
  });
  updateProgress();
}

function toggle(si, ii, el) {
  const key = si+'-'+ii;
  etat[key] = !etat[key];
  el.classList.toggle('done', etat[key]);
  el.querySelector('.check-box').textContent = etat[key] ? '✓' : '';
  updateCount(si);
  updateProgress();
}

function updateCount(si) {
  const total = taches[si].items.length;
  const done  = taches[si].items.filter((_, ii) => etat[si+'-'+ii]).length;
  document.getElementById(`count-${si}`).textContent = `${done} / ${total}`;
}

function updateProgress() {
  let total = 0, done = 0;
  taches.forEach((s, si) => s.items.forEach((_, ii) => { total++; if (etat[si+'-'+ii]) done++; }));
  document.getElementById('prog-text').textContent = `${done} / ${total}`;
  document.getElementById('prog-fill').style.width = total ? (done/total*100)+'%' : '0%';
  document.getElementById('success').classList.toggle('show', done > 0 && done === total);
}

function reset() { etat = {}; afficher(); }

charger();
</script>
</body>
</html>
